# ==============================================================================
# Streamlit Configuration for OceanForecast Philippines
# ==============================================================================

[theme]
primaryColor = "#0066CC"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1D23"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
port = 8501
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[logger]
level = "info"
