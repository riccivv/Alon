      - name: Sarangani
      - name: South Cotabato
      - name: Sultan Kudarat
      - name: Cotabato
      - name: Maguindanao del Norte
      - name: Maguindanao del Sur
      - name: Lanao del Sur
        note: inland (no marine catch)
  4:
    name: FMA4 - Visayan Sea
    provinces:
      - name: Aklan
