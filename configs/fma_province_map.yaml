#
# Curated province -> FMA map (OceanForecast Philippines)
#
# The BFAR FMA-263 management zones split the Philippine EEZ into six large
# areas. PSA catch exports are filed by *province*, not by management area, so
# each coastal province is assigned here to the FMA its dominant fishing
# grounds fall inside (border provinces carry a note listing other FMAs its
# coast touches).
#
# Accuracy note: this is a best-effort static lookup. The training join does
# NOT use FMA (see src/models/labels.py -- only lat/lon/year/quarter merge
# catches to cells), so the main consumer is the FMA breakdown shown in the
# app and decision docs. Border assignments can be refined later if an
# official FMA polygon set is obtained.
#
version: 2026-09-06
fma_province_map:
  1:
    name: FMA1 - North Philippine Sea
    provinces:
      - name: Batanes
      - name: Cagayan
      - name: Isabela
        note: Pacific coast only; also FMA6
      - name: Ilocos Norte
      - name: Ilocos Sur
      - name: La Union
      - name: Pangasinan
        note: Lingayen Gulf; also FMA2
      - name: Abra
        note: inland (no marine catch)
      - name: Apayao
        note: inland (no marine catch)
      - name: Benguet
        note: inland (no marine catch)
      - name: Ifugao
        note: inland (no marine catch)
      - name: Kalinga
        note: inland (no marine catch)
      - name: Mountain Province
        note: inland (no marine catch)
      - name: Quirino
        note: inland (no marine catch)
      - name: Nueva Vizcaya
        note: inland (no marine catch)
  2:
    name: FMA2 - West Philippine Sea
    provinces:
      - name: Zambales
      - name: Bataan
      - name: Pampanga
      - name: Bulacan
