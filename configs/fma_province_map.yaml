      - name: City of Bacolod
      - name: Cebu
      - name: Bohol
      - name: Siquijor
      - name: Masbate
        note: divides Visayan (west) and East PH Sea (east); primary FMA4
      - name: Romblon
        note: Sibuyan Sea; also FMA2/FMA6
  5:
    name: FMA5 - West Sulu Sea
    provinces:
      - name: Zamboanga del Norte
        note: Sulu Sea coast; also FMA3
