      - name: Cavite
      - name: Batangas
      - name: Marinduque
        note: Sibuyan Sea; also FMA4/FMA6
      - name: Occidental Mindoro
      - name: Oriental Mindoro
        note: east coast reaches FMA5
      - name: Palawan
        note: southern/eastern coasts reach FMA5; split by city where feasible
      - name: City of Puerto Princesa
      - name: Nueva Ecija
        note: inland (no marine catch)
      - name: Tarlac
        note: inland (no marine catch)
      - name: Laguna
        note: inland (no marine catch)
      - name: Rizal
        note: inland (no marine catch)
  3:
    name: FMA3 - Sulu-Celebes Sea
    provinces:
      - name: Basilan
      - name: Sulu
      - name: Tawi-tawi
      - name: Zamboanga del Sur
      - name: Zamboanga Sibugay
